<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kesar & Crumb</title>
<meta name="description" content="A premium patisserie — French technique, Indian pantry. Order the morning bake for pickup or delivery.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥐</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Karla:ital,wght@0,300..800;1,300..800&display=swap">
<style id="kc-style">
:root{
  --cacao:#191008; --cacao-2:#241811; --cacao-3:#2E2013;
  --kesar:#E9A83B; --kesar-deep:#C4832A; --pista:#B7C79C;
  --ivory:#F4E9DA; --muted:#A6907B; --line:#3A2A1B;
  --danger:#D97A6C; --ok:#9DBB86;
  --serif:'Italiana', Georgia, 'Times New Roman', serif;
  --sans:'Karla', 'Helvetica Neue', Arial, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cacao);color:var(--ivory);font-family:var(--sans);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ivory)}
a{color:inherit}
::selection{background:var(--kesar);color:var(--cacao)}
:focus-visible{outline:2px solid var(--kesar);outline-offset:3px;border-radius:2px}

/* ---------- header ---------- */
.hdr{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:1.1rem clamp(1.2rem,4vw,3rem);background:linear-gradient(to bottom, rgba(25,16,8,.92), rgba(25,16,8,0));transition:background .4s}
.hdr.scrolled,.hdr.solid{background:rgba(25,16,8,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.hdr-mark{font-family:var(--serif);font-size:1.35rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.hdr-mark .amp{color:var(--kesar)}
.hdr-nav{display:flex;gap:2rem;align-items:center}
.hdr-nav a{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s}
.hdr-nav a:hover{color:var(--kesar)}
@media(max-width:720px){.hdr-nav a:not(.always){display:none}}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6rem 1.2rem 4rem;position:relative}
.hero-eyebrow{font-size:.75rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);display:flex;gap:1.1rem;align-items:center;opacity:0;animation:rise .9s .2s cubic-bezier(.2,.7,.2,1) forwards}
.hero-eyebrow::before,.hero-eyebrow::after{content:"";width:34px;height:1px;background:var(--line)}
.hero-title{font-family:var(--serif);font-weight:400;font-size:clamp(3.2rem,12.5vw,10.5rem);line-height:.95;letter-spacing:.04em;text-transform:uppercase;margin:1.6rem 0 .4rem;text-wrap:balance}
.hero-title .ln{display:block;overflow:hidden}
.hero-title .w{display:inline-block;transform:translateY(110%);animation:rise 1s cubic-bezier(.2,.75,.15,1) forwards}
.hero-title .ln:nth-child(1) .w{animation-delay:.35s}
.hero-title .ln:nth-child(2) .w{animation-delay:.5s}
.hero-title .amp{color:var(--kesar);font-size:.62em;vertical-align:.14em;padding:0 .08em}
.thread{width:min(420px,70vw);margin:.4rem auto 1.8rem;display:block}
.thread path{stroke:var(--kesar);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.6s 1s cubic-bezier(.6,0,.3,1) forwards}
.thread circle{fill:var(--kesar);opacity:0;animation:fadein .5s 2.4s forwards}
.hero-sub{max-width:34rem;color:var(--muted);font-size:1.02rem;opacity:0;animation:rise .9s 1.15s cubic-bezier(.2,.7,.2,1) forwards}
.hero-cta{margin-top:2.4rem;display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;opacity:0;animation:rise .9s 1.35s cubic-bezier(.2,.7,.2,1) forwards}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 2.1rem;border-radius:999px;font-size:.8rem;letter-spacing:.24em;text-transform:uppercase;font-weight:700;transition:transform .25s,box-shadow .25s,background .25s,color .25s,border-color .25s;text-decoration:none;justify-content:center}
.btn-gold{background:var(--kesar);color:#241504}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 30px -10px rgba(233,168,59,.55)}
.btn-gold:disabled{opacity:.55;transform:none;box-shadow:none;cursor:default}
.btn-ghost{border:1px solid var(--line);color:var(--ivory)}
.btn-ghost:hover{border-color:var(--kesar);color:var(--kesar)}
.btn-sm{padding:.5rem 1.1rem;font-size:.68rem;letter-spacing:.18em}
.btn-danger{border:1px solid rgba(217,122,108,.5);color:var(--danger)}
.btn-danger:hover{border-color:var(--danger)}
.btn-wide{width:100%}
.hero-scroll{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);color:var(--muted);font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:fadein 1s 2s forwards}
.hero-scroll::after{content:"";display:block;width:1px;height:34px;background:linear-gradient(var(--kesar),transparent);margin:.5rem auto 0;animation:drip 1.8s 2.2s ease-in-out infinite}

/* ---------- marquee ---------- */
.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:1rem 0;white-space:nowrap}
.marquee-track{display:inline-flex;gap:3.2rem;padding-right:3.2rem;animation:scroll 36s linear infinite}
.marquee span{font-family:var(--serif);font-size:1.25rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.marquee i{color:var(--kesar);font-style:normal}
.marquee:hover .marquee-track{animation-play-state:paused}

/* ---------- sections ---------- */
.sec{padding:clamp(4rem,9vw,7.5rem) clamp(1.2rem,5vw,4rem);max-width:1240px;margin:0 auto}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:2rem;flex-wrap:wrap;margin-bottom:3rem}
.kicker{font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--kesar);display:block;margin-bottom:.8rem}
.sec-title{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,5vw,3.4rem);letter-spacing:.03em;text-wrap:balance}
.sec-note{color:var(--muted);max-width:26rem;font-size:.95rem}

/* ---------- vitrine ---------- */
.vitrine{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1.4rem}
.card{background:var(--cacao-2);border:1px solid var(--line);border-radius:18px;padding:1rem 1.4rem 1.4rem;display:flex;flex-direction:column;gap:.9rem;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(244,233,218,.06) 50%,transparent 60%);transform:translateX(-120%);transition:transform .7s ease;pointer-events:none}
.card:hover{transform:translateY(-6px);border-color:#54402a;box-shadow:0 24px 44px -24px rgba(0,0,0,.75)}
.card:hover::after{transform:translateX(120%)}
.card-img{border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--cacao-3);position:relative}
.card-img svg{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .card-img svg{transform:scale(1.05)}
.card.sold .card-img svg{filter:grayscale(.7) brightness(.6)}
.sold-tag{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:1.3rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ivory);background:rgba(25,16,8,.45)}
.low-tag{position:absolute;right:.6rem;bottom:.6rem;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#241504;background:var(--kesar);border-radius:999px;padding:.25rem .7rem}
.card h3{font-family:var(--serif);font-weight:400;font-size:1.35rem;letter-spacing:.04em;text-align:center;text-wrap:balance}
.card .ing{color:var(--muted);font-size:.85rem;text-align:center;min-height:2.6em}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:1rem;border-top:1px solid var(--line)}
.price{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.03em;font-size:1.05rem}
.add{width:42px;height:42px;border-radius:50%;border:1px solid var(--kesar);color:var(--kesar);font-size:1.3rem;line-height:1;display:grid;place-items:center;transition:background .25s,color .25s,transform .2s}
.add:hover{background:var(--kesar);color:#241504}
.add:active{transform:scale(.88)}
.add:disabled{border-color:var(--line);color:var(--line);cursor:default}
.add:disabled:hover{background:none}
.add.added{background:var(--kesar);color:#241504;animation:pop .45s cubic-bezier(.3,1.6,.4,1)}
.tag{position:absolute;top:1.5rem;left:1.9rem;z-index:2;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--pista);border:1px solid rgba(183,199,156,.4);border-radius:999px;padding:.25rem .7rem;background:rgba(25,16,8,.55)}

/* ---------- tenets / guestbook / bespoke ---------- */
.tenets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.4rem}
.tenet{border-top:1px solid var(--line);padding-top:1.6rem}
.tenet h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:.2rem 0 .7rem;letter-spacing:.03em}
.tenet p{color:var(--muted);font-size:.95rem;max-width:30rem}
.tenet .glyph{color:var(--kesar);font-size:1.1rem}
.gbook{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.4rem}
.gb{background:var(--cacao-2);border:1px solid var(--line);border-radius:16px;padding:1.5rem}
.gb .stars{color:var(--kesar);letter-spacing:.2em;font-size:.9rem}
.gb p{margin:.8rem 0;font-size:.98rem}
.gb .who{color:var(--muted);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase}
.gb .reply{border-left:2px solid var(--kesar);padding:.4rem 0 .4rem .9rem;margin-top:.9rem;color:var(--muted);font-size:.88rem}
.gb .reply b{color:var(--kesar);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;display:block;margin-bottom:.2rem}
.bespoke{background:linear-gradient(140deg,var(--cacao-2),#1E1409 65%);border:1px solid var(--line);border-radius:24px;padding:clamp(2.4rem,6vw,4.5rem);text-align:center;position:relative;overflow:hidden}
.bespoke::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(233,168,59,.14),transparent 65%);top:-180px;right:-120px;pointer-events:none}
.bespoke h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,4.5vw,3rem);letter-spacing:.03em;text-wrap:balance}
.bespoke p{color:var(--muted);max-width:36rem;margin:1rem auto 2rem}

.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.08s}.rv.d2{transition-delay:.16s}.rv.d3{transition-delay:.24s}.rv.d4{transition-delay:.32s}

/* ---------- footer ---------- */
.ftr{border-top:1px solid var(--line);padding:3.5rem clamp(1.2rem,5vw,4rem) 2.5rem;max-width:1240px;margin:0 auto}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2.5rem;margin-bottom:3rem}
.ftr h4{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--kesar);margin-bottom:1rem}
.ftr p,.ftr li{color:var(--muted);font-size:.92rem}
.ftr ul{list-style:none}
.ftr li{margin-bottom:.4rem}
.ftr-mark{font-family:var(--serif);font-size:2rem;letter-spacing:.12em;text-transform:uppercase}
.ftr-base{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1.6rem;color:var(--muted);font-size:.8rem}
.linkish{background:none;border:none;color:var(--muted);font-size:.92rem;text-decoration:underline dotted;cursor:pointer;padding:0}
.linkish:hover{color:var(--kesar)}
a.linkish{text-decoration:underline dotted}

/* ---------- cart ---------- */
.cart-fab{position:fixed;right:1.4rem;bottom:1.4rem;z-index:45;display:flex;align-items:center;gap:.7rem;background:var(--kesar);color:#241504;border-radius:999px;padding:.9rem 1.5rem;font-weight:800;letter-spacing:.16em;font-size:.78rem;text-transform:uppercase;box-shadow:0 16px 40px -12px rgba(233,168,59,.5);transition:transform .25s,box-shadow .25s}
.cart-fab:hover{transform:translateY(-2px)}
.cart-fab .n{background:#241504;color:var(--kesar);border-radius:999px;min-width:1.5rem;height:1.5rem;display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0 .35rem}
.cart-fab.bump{animation:pop .45s cubic-bezier(.3,1.6,.4,1)}
.cart-fab[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(12,7,3,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:48}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:50;background:var(--cacao-2);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.75,.15,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:1.4rem 1.6rem;border-bottom:1px solid var(--line)}
.drawer-h h2{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:.08em;text-transform:uppercase}
.x{font-size:1.5rem;color:var(--muted);width:40px;height:40px;border-radius:50%;transition:color .2s,background .2s}
.x:hover{color:var(--ivory);background:var(--cacao-3)}
.drawer-body{flex:1;overflow-y:auto;padding:1.2rem 1.6rem}
.cline{display:flex;align-items:center;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.cline .dot{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(233,168,59,.35)}
.cline .nm{flex:1;min-width:0}
.cline .nm b{display:block;font-weight:700;font-size:.95rem}
.cline .nm span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:.15rem;border:1px solid var(--line);border-radius:999px}
.qty button{width:30px;height:30px;color:var(--muted);font-size:1.05rem;transition:color .2s}
.qty button:hover{color:var(--kesar)}
.qty b{min-width:1.4rem;text-align:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.cempty{text-align:center;color:var(--muted);padding:3rem 1rem}
.cempty .big{font-family:var(--serif);font-size:1.6rem;color:var(--ivory);display:block;margin-bottom:.5rem}
.drawer-f{border-top:1px solid var(--line);padding:1.3rem 1.6rem;display:grid;gap:1rem}
.trow{display:flex;justify-content:space-between;font-size:1.05rem}
.trow b{font-variant-numeric:tabular-nums}

/* ---------- pages ---------- */
.page{min-height:100svh;max-width:760px;margin:0 auto;padding:6.5rem clamp(1.2rem,4vw,2rem) 4rem}
.page-h{margin-bottom:2rem}
.page-h h1{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);letter-spacing:.04em}
.page-h p{color:var(--muted);font-size:.95rem;margin-top:.4rem}
.steps{display:flex;gap:.5rem;margin-bottom:2.2rem}
.step{flex:1;text-align:center;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding-bottom:.7rem;border-bottom:2px solid var(--line);transition:color .3s,border-color .3s}
.step.on{color:var(--kesar);border-color:var(--kesar);font-weight:800}
.step.done{color:var(--ivory);border-color:var(--kesar-deep)}
.co-card{background:var(--cacao-2);border:1px solid var(--line);border-radius:18px;padding:clamp(1.4rem,4vw,2rem);margin-bottom:1.2rem}
.co-nav{display:flex;gap:.8rem;margin-top:1.4rem;flex-wrap:wrap}
.co-nav .btn{flex:1;min-width:140px}
.sumrow{display:flex;justify-content:space-between;gap:1rem;font-size:.95rem;padding:.32rem 0;color:var(--muted)}
.sumrow b{color:var(--ivory);font-variant-numeric:tabular-nums;font-weight:700}
.sumrow.total{border-top:1px solid var(--line);margin-top:.6rem;padding-top:.9rem;font-size:1.15rem;color:var(--ivory)}
.sumrow .off{color:var(--ok)}
.pill-note{display:inline-flex;align-items:center;gap:.5rem;border:1px solid rgba(157,187,134,.4);color:var(--ok);border-radius:999px;padding:.35rem .9rem;font-size:.78rem;letter-spacing:.08em}
.applyrow{display:flex;gap:.7rem}
.applyrow input{flex:1;background:var(--cacao);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;text-transform:uppercase;letter-spacing:.12em}
.applyrow input:focus{border-color:var(--kesar);outline:none}
.hint{color:var(--muted);font-size:.8rem;margin-top:.4rem}
.loc-btn{display:inline-flex;align-items:center;gap:.5rem;margin-top:.5rem}
.wa-btn{border:1px solid rgba(157,187,134,.55);color:var(--ok)}
.wa-btn:hover{border-color:var(--ok);color:var(--ok)}

/* ---------- modal & forms ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.modal-card{width:min(540px,100%);max-height:92svh;overflow-y:auto;background:var(--cacao-2);border:1px solid var(--line);border-radius:20px;padding:2rem;transform:translateY(18px) scale(.98);transition:transform .35s cubic-bezier(.2,.75,.2,1)}
.modal.on .modal-card{transform:none}
.modal-card h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;letter-spacing:.06em;margin-bottom:.3rem}
.modal-card .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.field{display:grid;gap:.4rem;margin-bottom:1.05rem}
.field label{font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--cacao);border:1px solid var(--line);border-radius:10px;padding:.8rem .95rem;transition:border-color .25s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--kesar);outline:none}
.field textarea{resize:vertical;min-height:70px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:460px){.frow{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{flex:1;padding:.8rem;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:background .25s,color .25s}
.seg button.on{background:var(--kesar);color:#241504;font-weight:800}
.ferr{color:var(--danger);font-size:.85rem;min-height:1.2em;margin-bottom:.4rem}
.notice{border:1px solid var(--line);border-left:3px solid var(--pista);border-radius:8px;padding:.8rem 1rem;font-size:.85rem;color:var(--muted);text-align:left;margin-bottom:1.2rem}
.confirm{text-align:center;padding:1rem 0}
.confirm .seal{width:76px;height:76px;margin:0 auto 1.2rem;border-radius:50%;border:1px solid var(--kesar);display:grid;place-items:center;color:var(--kesar);font-size:2rem;animation:pop .6s cubic-bezier(.3,1.6,.4,1)}
.confirm h2{margin-bottom:.4rem}
.confirm .oid{font-variant-numeric:tabular-nums;letter-spacing:.2em;color:var(--kesar);font-weight:800;font-size:1.1rem;margin:.6rem 0 1rem}
.confirm p{color:var(--muted);font-size:.92rem;max-width:26rem;margin:0 auto 1.4rem}
.starpick{display:flex;gap:.4rem}
.starpick button{font-size:1.7rem;color:var(--line);transition:color .15s,transform .15s}
.starpick button.on{color:var(--kesar)}
.starpick button:hover{transform:scale(1.15)}

/* ---------- tracking ---------- */
.tl{display:grid;gap:.15rem;margin:1rem 0}
.tl-step{display:flex;gap:.9rem;align-items:flex-start}
.tl-step .rail{display:flex;flex-direction:column;align-items:center}
.tl-step .pin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:.2rem}
.tl-step .bar{width:2px;flex:1;min-height:18px;background:var(--line)}
.tl-step:last-child .bar{display:none}
.tl-step.done .pin{border-color:var(--kesar);background:var(--kesar)}
.tl-step.done .bar{background:var(--kesar)}
.tl-step.now .pin{border-color:var(--kesar);box-shadow:0 0 0 4px rgba(233,168,59,.2)}
.tl-step .lbl{font-size:.92rem;padding-bottom:1rem}
.tl-step.now .lbl{color:var(--kesar);font-weight:700}
.tl-step.todo .lbl{color:var(--muted)}
.torder{border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem;margin-bottom:1rem;background:var(--cacao-2)}
.torder .top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem}
.torder .id{color:var(--kesar);font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.torder .items{color:var(--muted);font-size:.85rem}

/* ---------- status chips ---------- */
.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;border-radius:999px;padding:.28rem .8rem;border:1px solid var(--line);color:var(--muted)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.s-new{color:var(--ivory);border-color:#54402a}
.chip.s-new::before{background:var(--ivory)}
.chip.s-active{color:var(--kesar);border-color:rgba(233,168,59,.45)}
.chip.s-active::before{background:var(--kesar)}
.chip.s-done{color:var(--ok);border-color:rgba(157,187,134,.4)}
.chip.s-done::before{background:var(--ok)}
.chip.s-cancel{color:var(--danger);border-color:rgba(217,122,108,.4)}
.chip.s-cancel::before{background:var(--danger)}

/* ---------- admin ---------- */
.adm{min-height:100svh;display:flex;flex-direction:column}
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.2rem clamp(1.2rem,4vw,2.5rem);border-bottom:1px solid var(--line);background:var(--cacao-2)}
.adm-top .ttl{display:flex;align-items:baseline;gap:1rem}
.adm-top .ttl b{font-family:var(--serif);font-weight:400;font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase}
.adm-top .ttl span{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--kesar);border:1px solid rgba(233,168,59,.4);border-radius:999px;padding:.2rem .7rem}

.adm-tabs button{padding:.6rem 1.2rem;border-radius:999px;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);border:1px solid transparent;transition:color .2s,border-color .2s,background .2s}
.adm-tabs button:hover{color:var(--ivory)}
.adm-tabs button.on{color:var(--kesar);border-color:rgba(233,168,59,.45);background:var(--cacao-2)}
.adm-body{padding:1.6rem clamp(1.2rem,4vw,2.5rem) 4rem;max-width:1240px;width:100%;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.6rem}
.tile{background:var(--cacao-2);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.3rem}
.tile .k{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:.3rem;line-height:1.1}
.tile .s{font-size:.78rem;color:var(--muted);margin-top:.2rem}
.panel{background:var(--cacao-2);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem;margin-bottom:1.4rem}
.panel h3{font-family:var(--serif);font-weight:400;font-size:1.25rem;letter-spacing:.06em;margin-bottom:1rem}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media(max-width:820px){.panel-grid{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr auto;gap:.8rem;align-items:center;margin-bottom:.55rem;font-size:.88rem}
.hbar .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{background:var(--cacao-3);border-radius:4px;height:14px;overflow:hidden}
.hbar .fl{height:100%;background:var(--kesar);border-radius:0 4px 4px 0;min-width:2px}
.hbar .vl{font-variant-numeric:tabular-nums;font-weight:700;font-size:.82rem}
.cols{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:.6rem}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;min-width:0}
.col .b{width:100%;max-width:38px;background:var(--kesar);border-radius:4px 4px 0 0;min-height:2px}
.col.zero .b{background:var(--cacao-3)}
.col .d{font-size:.66rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

.toolbar select{background:var(--cacao-2);border:1px solid var(--line);border-radius:999px;padding:.6rem 1rem}

.row .id{color:var(--kesar);font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums}

.row .meta{color:var(--muted);font-size:.85rem;margin-top:.3rem}
.row .items{color:var(--muted);font-size:.84rem;margin-top:.3rem}
.row .acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.row .amt{font-variant-numeric:tabular-nums;font-weight:800}

.empty{color:var(--muted);text-align:center;padding:3rem 1rem}
.mrow{display:grid;grid-template-columns:52px 1fr auto auto auto;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .th{width:52px;height:40px;border-radius:8px;overflow:hidden;background:var(--cacao-3)}
.mrow .th svg{width:100%;height:100%;display:block}
.mrow input[type=number]{width:84px;background:var(--cacao);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;font-variant-numeric:tabular-nums}
.mrow .cap{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:.2rem}
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:var(--cacao-3);border:1px solid var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on{background:rgba(233,168,59,.25)}
.switch.on::after{transform:translateX(20px);background:var(--kesar)}

.gate-card h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem}
.gate-card .sub{color:var(--muted);font-size:.88rem;margin-bottom:1.6rem}
.gate-card input{width:100%;text-align:center;letter-spacing:.6em;font-size:1.3rem;background:var(--cacao);border:1px solid var(--line);border-radius:12px;padding:.8rem;font-variant-numeric:tabular-nums}
.gate-card input:focus{border-color:var(--kesar);outline:none}

.toast{position:fixed;left:50%;bottom:5.6rem;transform:translate(-50%,20px);z-index:70;background:var(--ivory);color:#241504;font-weight:700;font-size:.85rem;letter-spacing:.06em;padding:.75rem 1.4rem;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drip{0%,100%{transform:scaleY(.3);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}
@keyframes scroll{to{transform:translateX(-50%)}}
@keyframes pop{0%{transform:scale(.75)}55%{transform:scale(1.12)}100%{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;transition-duration:.01ms !important}
  .rv{opacity:1;transform:none}
  .hero-title .w,.hero-eyebrow,.hero-sub,.hero-cta{opacity:1;transform:none}
  .thread path{stroke-dashoffset:0}.thread circle{opacity:1}
  html{scroll-behavior:auto}
}

function inr(n){ return '₹' + (n||0).toLocaleString('en-IN'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDT(ts){ try{ return new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function fmtD(ts){ try{ return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'}); }catch(e){ return ''; } }
function phoneKey(p){ return String(p||'').replace(/\D/g,'').slice(-10); }
function waNum(p){ var d=String(p||'').replace(/\D/g,''); if(d.length===10) d='91'+d; return d; }
function stars(n){ var s=''; for(var i=1;i<=5;i++) s+= i<=n ? '★' : '☆'; return s; }

var STATUS_LABEL = {new:'Received', confirmed:'Confirmed', baking:'In the oven', ready:'Ready at counter', out:'Out for delivery', completed:'Completed', cancelled:'Cancelled'};
function flowOf(o){ return o.mode==='delivery' ? ['new','confirmed','baking','out','completed'] : ['new','confirmed','baking','ready','completed']; }
function chipClass(st){ if(st==='completed')return 's-done'; if(st==='cancelled')return 's-cancel'; if(st==='new')return 's-new'; return 's-active'; }
function chip(st){ return '<span class="chip '+chipClass(st)+'">'+STATUS_LABEL[st]+'</span>'; }
function loyaltyBalance(phone){ /* admin-side, from full order data */
  var k=phoneKey(phone); if(!k||k.length<8) return 0;
  var b=0;
  S().orders.forEach(function(o){
    if(o.status==='cancelled') return;
    if(phoneKey(o.phone)!==k) return;
    b += (o.pointsEarned||0) - (o.pointsRedeemed||0);
  });
  return Math.max(0,b);
}

  var els=document.querySelectorAll('.rv');
  if(reduce||!('IntersectionObserver' in window)){ els.forEach(function(el){ el.classList.add('in'); }); }

}

function useLocation(){
  var hint=document.getElementById('loc-hint'), btn=document.getElementById('use-loc');
  if(!navigator.geolocation){ hint.textContent='Location isn’t available in this browser — type the address instead.'; return; }
  btn.disabled=true; btn.textContent='Finding you…';
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude.toFixed(6), lng=pos.coords.longitude.toFixed(6);
    var acc=Math.round(pos.coords.accuracy||0);
    var pin='📍 Pin: https://maps.google.com/?q='+lat+','+lng+(acc?' (±'+acc+' m)':'');
    var ta=document.getElementById('f-addr');

    ta.value=(cur?cur+'\n':'')+pin;

    btn.disabled=false; btn.textContent='📍 Pin updated';
    hint.textContent='Pinned. Add the flat, floor or landmark above the pin line.';
  }, function(err){
    btn.disabled=false; btn.textContent='📍 Pin my current location';

function renderTrack(q){

function timelineHTML(o){
  if(o.status==='cancelled'){
    return '<div class="tl"><div class="tl-step now"><span class="rail"><span class="pin"></span></span><span class="lbl" style="color:var(--danger)">Cancelled — call the atelier if this is a surprise.</span></div></div>';
  }
  var flow=flowOf(o), idx=flow.indexOf(o.status); if(idx<0) idx=0;
  return '<div class="tl">'+flow.map(function(st,i){
    var cls=i<idx?'done':(i===idx?'now':'todo');

  }).join('')+'</div>';

function runTrack(){
  var q=(document.getElementById('track-q').value||'').trim();

  if(!q){ res.innerHTML='<p class="ferr">Type something to search for.</p>'; return; }
  res.innerHTML='<p class="hint">Looking…</p>';
  api('/api/track?q='+encodeURIComponent(q)).then(function(r){
    var hits=r.orders||[];
    if(!hits.length){ res.innerHTML='<p class="ferr">Nothing found. Check the number.</p>'; return; }
    res.innerHTML=hits.map(function(o){
      return '<div class="torder"><div class="top"><span class="id">'+esc(o.id)+'</span>'+chip(o.status)+'</div>'
      + '<div class="items">'+(o.items||[]).map(function(it){ return it.qty+' × '+esc(it.name); }).join(' · ')+' — '+inr(o.total)+'</div>'
      + timelineHTML(o)+'</div>';
    }).join('');
  }).catch(function(e){ res.innerHTML='<p class="ferr">'+esc(e.message)+'</p>'; });
}

function dashHTML(){
  var st=S();
  var today=new Date(); var t0=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
  var live=st.orders.filter(function(o){ return o.status!=='cancelled'; });
  var todays=live.filter(function(o){ return new Date(o.ts).getTime()>=t0; });
  var open=st.orders.filter(function(o){ return o.status!=='completed'&&o.status!=='cancelled'; });
  var revenue=live.reduce(function(s,o){ return s+(o.total||0); },0);
  var todayRev=todays.reduce(function(s,o){ return s+(o.total||0); },0);
  var ratings=st.feedback.filter(function(f){ return !f.hidden; });
  var avg=ratings.length? (ratings.reduce(function(s,f){ return s+f.rating; },0)/ratings.length) : 0;
  var qty={};
  live.forEach(function(o){ (o.items||[]).forEach(function(it){ qty[it.name]=(qty[it.name]||0)+it.qty; }); });
  var top=Object.keys(qty).map(function(n){ return [n,qty[n]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
  var maxQ=top.length?top[0][1]:1;
  var days=[]; var maxD=1;
  for(var i=6;i>=0;i--){
    var d=new Date(t0-i*86400000);
    var d1=d.getTime(), d2=d1+86400000;
    var v=live.reduce(function(s,o){ var t=new Date(o.ts).getTime(); return (t>=d1&&t<d2)?s+(o.total||0):s; },0);
    if(v>maxD) maxD=v;
    days.push({lbl:['S','M','T','W','T','F','S'][d.getDay()], v:v, full:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})});
  }
  var recent=st.orders.slice(-5).reverse();
  return '<div class="tiles">'
  + '<div class="tile"><div class="k">Orders today</div><div class="v">'+todays.length+'</div><div class="s">'+inr(todayRev)+' taken</div></div>'
  + '<div class="tile"><div class="k">Open orders</div><div class="v">'+open.length+'</div><div class="s">not yet completed</div></div>'
  + '<div class="tile"><div class="k">All-time revenue</div><div class="v">'+inr(revenue)+'</div><div class="s">'+live.length+' orders</div></div>'
  + '<div class="tile"><div class="k">Guest rating</div><div class="v">'+(ratings.length?avg.toFixed(1):'—')+'</div><div class="s">'+ratings.length+' review'+(ratings.length===1?'':'s')+'</div></div>'
  + '</div>'
  + '<div class="panel-grid">'
  + '<div class="panel"><h3>Top sellers</h3>'
  + (top.length?top.map(function(t){ return '<div class="hbar"><span class="nm">'+esc(t[0])+'</span><span class="tr"><span class="fl" style="width:'+Math.round(t[1]/maxQ*100)+'%"></span></span><span class="vl">'+t[1]+'</span></div>'; }).join(''):'<p class="empty">No sales yet.</p>')
  + '</div>'
  + '<div class="panel"><h3>Last 7 days · revenue</h3>'
  + '<div class="cols">'+days.map(function(d){ return '<div class="col'+(d.v?'':' zero')+'" title="'+d.full+' — '+inr(d.v)+'"><span class="b" style="height:'+Math.max(2,Math.round(d.v/maxD*92))+'px"></span><span class="d">'+d.lbl+'</span></div>'; }).join('')+'</div>'
  + '</div></div>'
  + '<div class="panel"><h3>Latest orders</h3>'
  + (recent.length?recent.map(function(o){
      return '<div class="hbar" style="grid-template-columns:auto 1fr auto auto"><span style="color:var(--kesar);font-weight:800;font-variant-numeric:tabular-nums">'+esc(o.id)+'</span><span class="nm">'+esc(o.name)+' · '+fmtDT(o.ts)+'</span>'+chip(o.status)+'<span class="vl">'+inr(o.total)+'</span></div>';
    }).join(''):'<p class="empty">The order book is empty — share the shop link and watch this fill.</p>')
  + '</div>';
}

var custQ='';
function customersAgg(){
  var m={};
  S().orders.forEach(function(o){
    if(o.status==='cancelled') return;
    var k=phoneKey(o.phone); if(!k) return;
    if(!m[k]) m[k]={key:k, name:o.name, phone:o.phone, count:0, spend:0, last:o.ts};
    m[k].count++; m[k].spend+=(o.total||0);
    if(o.ts>m[k].last){ m[k].last=o.ts; m[k].name=o.name; m[k].phone=o.phone; }
  });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return b.spend-a.spend; });
}

    + '<span><span style="color:var(--kesar);letter-spacing:.15em">'+stars(f.rating)+'</span> &nbsp; <span class="who">'+esc(f.name||'A guest')+'</span>'+(f.orderId?' &nbsp;<span class="meta" style="display:inline">'+esc(f.orderId)+'</span>':'')+'</span>'
    + '<span class="chip '+(f.hidden?'s-cancel':'s-done')+'">'+(f.hidden?'Hidden':'Public')+'</span></div>'
    + '<div class="meta">'+fmtDT(f.ts)+'</div>'
    + '<div style="margin-top:.5rem">“'+esc(f.comment)+'”</div>'
    + '<textarea data-reply="'+esc(f.id)+'" placeholder="Reply from the kitchen (shows in the guestbook)…">'+esc(f.reply||'')+'</textarea>'
    + '<div class="acts">'
    + '<button class="btn btn-gold btn-sm" data-savereply="'+esc(f.id)+'">Save reply</button>'
    + '<button class="btn btn-ghost btn-sm" data-togglefb="'+esc(f.id)+'" data-hidden="'+(f.hidden?'0':'1')+'">'+(f.hidden?'Show in guestbook':'Hide from guestbook')+'</button>'
    + '<button class="btn btn-danger btn-sm" data-delfb="'+esc(f.id)+'">Delete</button>'
    + '</div></div>';
  }).join(''):'<p class="empty">No feedback yet — guests find it under “Leave feedback” in the shop footer.</p>';
}

      + '<span><span class="cap">Stock</span><input type="number" min="0" step="1" data-stock="'+p.id+'" value="'+st+'" placeholder="—" aria-label="Stock of '+esc(p.name)+'"></span>'

function saveMenu(){
  var menu={};
  PRODUCTS.forEach(function(p){
    var priceEl=document.querySelector('[data-price="'+p.id+'"]');
    var stockEl=document.querySelector('[data-stock="'+p.id+'"]');
    var availEl=document.querySelector('[data-avail="'+p.id+'"]');
    menu[p.id]={
      price: priceEl?parseInt(priceEl.value,10):p.price,
      stock: stockEl?stockEl.value.trim():'',
      soldOut: availEl?!availEl.classList.contains('on'):false
    };
  });
  admAction(api('/api/admin/menu',{method:'PUT',admin:true,body:{menu:menu}}).then(function(d){
    api('/api/boot').then(applyBoot).catch(function(){});
    return d;
  }),'Menu published');
}

function exportCSV(kind){
  fetch('/api/admin/export/'+kind,{headers:{Authorization:'Bearer '+A.token}})
  .then(function(r){ if(!r.ok) throw new Error('Export failed.'); return r.blob(); })
  .then(function(b){
    var a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download='kesar-crumb-'+kind;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Saved kesar-crumb-'+kind);
  }).catch(function(e){ toast(e.message); });
}

/* ================= ROUTER & EVENTS ================= */
var lastView=null;
function route(){
  var h=location.hash;
  var view = h==='#admin'?'admin' : h==='#checkout'?'checkout' : h==='#track'?'track' : h==='#feedback'?'feedback' : 'shop';
  if(view==='shop'&&lastView==='shop'){ return; }
  var prev=lastView;
  lastView=view;
  if(view==='admin') renderAdmin();
  else if(view==='checkout'){ if(prev!=='checkout') co.step=1; renderCheckout(); }
  else if(view==='track') renderTrack('');
  else if(view==='feedback') renderFeedback();
  else renderShop();
}

document.addEventListener('click', function(ev){
  var t=ev.target.closest?ev.target.closest('button, a'):null;
  if(!t) return;
  if(t.dataset.gohome){
    var dest=t.getAttribute('href')||'#top';
    lastView=null;
    if(location.hash===dest){ renderShop(); lastView='shop'; }
    if(t.tagName!=='A'){ location.hash=dest; }
    return;
  }
  if(t.dataset.tab){ admTab=t.dataset.tab; renderAdmTab(); return; }

  /* storefront */
  if(t.dataset.add){
    var id=t.dataset.add;
    if(isSold(id)) return;
    var s=stockOf(id);
    if(s!==null&&(cart[id]||0)>=s){ toast('Only '+s+' of those left today.'); return; }
    cart[id]=Math.min(20,(cart[id]||0)+1); saveCart(); renderCart();
    t.classList.remove('added'); void t.offsetWidth; t.classList.add('added');
    bump(document.getElementById('cart-fab'));
    toast(byId[id].name+' — in the box');
    return;
  }
  if(t.dataset.inc){
    var ii=t.dataset.inc, si=stockOf(ii);
    if(si!==null&&cart[ii]>=si){ toast('Only '+si+' of those left today.'); return; }
    cart[ii]=Math.min(20,cart[ii]+1); saveCart(); renderCart();
    if(lastView==='checkout') renderCheckout();
    return;
  }
  if(t.dataset.dec){
    var k=t.dataset.dec; cart[k]--; if(cart[k]<=0) delete cart[k];
    saveCart(); renderCart();
    if(lastView==='checkout') renderCheckout();
    else if(cartCount()===0) closeDrawer();
    return;
  }
  if(t.id==='cart-fab'){ renderCart(); openDrawer(); return; }
  if(t.id==='drawer-x'){ closeDrawer(); return; }
  if(t.id==='conf-done'){ closeModal(); return; }
  if(t.id==='bespoke-btn'){
    if(!isSold('rose-entremet')){ cart['rose-entremet']=Math.min(20,(cart['rose-entremet']||0)+1); saveCart(); renderCart(); }
    openDrawer(); toast('Started with the entremet — tell the kitchen more in the note');
    return;
  }

  /* checkout */
  if(t.dataset.costep){
    var target=parseInt(t.dataset.costep,10);
    if(co.step===2) readStep2();
    if(target>co.step&&co.step===2&&!validStep2()) return;
    co.step=target; renderCheckout(); return;
  }
  if(t.closest('#seg')&&t.dataset.mode){
    readStep2(); co.mode=t.dataset.mode;
    document.querySelectorAll('#seg button').forEach(function(b){ b.classList.toggle('on', b===t); });
    var wrap=document.getElementById('f-addr-wrap'); if(wrap) wrap.hidden=(co.mode!=='delivery');
    return;
  }
  if(t.id==='use-loc'){ readStep2(); useLocation(); return; }
  if(t.id==='apply-promo'){ applyPromo(); return; }
  if(t.dataset.rmpromo){ co.promo=null; renderCheckout(); return; }
  if(t.id==='apply-points'){ applyPoints(); return; }
  if(t.id==='place'){ placeOrder(); return; }

  /* track & feedback */
  if(t.id==='track-go'){ runTrack(); return; }
  if(t.id==='fb-send'){ sendFeedback(); return; }
  if(t.dataset.star){
    fbRating=parseInt(t.dataset.star,10);
    document.querySelectorAll('#starpick button').forEach(function(b){ b.classList.toggle('on', parseInt(b.dataset.star,10)<=fbRating); });
    return;
  }

  /* admin */
  if(t.id==='pin-go'){ adminLogin(); return; }
  if(t.id==='adm-lock'){
    A.token=null; A.data=null;
    try{ sessionStorage.removeItem('kc-token'); }catch(e){}
    renderAdmin(); return;
  }
  if(t.dataset.setstatus){
    admAction(api('/api/admin/orders/'+encodeURIComponent(t.dataset.setstatus)+'/status',{method:'POST',admin:true,body:{status:t.dataset.status}}),
      t.dataset.setstatus+' → '+STATUS_LABEL[t.dataset.status]);
    return;
  }
  if(t.dataset.csv){ exportCSV(t.dataset.csv); return; }
  if(t.dataset.tagval){
    admAction(api('/api/admin/customers/'+t.dataset.tag,{method:'PUT',admin:true,body:{tag:t.dataset.tagval}}),'Guest updated');
    return;
  }
  if(t.dataset.savecust){
    var ta=document.querySelector('[data-note="'+t.dataset.savecust+'"]');
    admAction(api('/api/admin/customers/'+t.dataset.savecust,{method:'PUT',admin:true,body:{note:ta?ta.value.trim():''}}),'Guest updated');
    return;
  }
  if(t.dataset.savereply){
    var rta=document.querySelector('[data-reply="'+t.dataset.savereply+'"]');
    admAction(api('/api/admin/feedback/'+encodeURIComponent(t.dataset.savereply),{method:'PATCH',admin:true,body:{reply:rta?rta.value.trim():''}}),'Feedback updated');
    return;
  }
  if(t.dataset.togglefb){
    admAction(api('/api/admin/feedback/'+encodeURIComponent(t.dataset.togglefb),{method:'PATCH',admin:true,body:{hidden:t.dataset.hidden==='1'}}),'Feedback updated');
    return;
  }
  if(t.dataset.delfb){
    admAction(api('/api/admin/feedback/'+encodeURIComponent(t.dataset.delfb),{method:'DELETE',admin:true}),'Feedback removed');
    return;
  }
  if(t.dataset.avail!==undefined&&t.classList.contains('switch')){
    t.classList.toggle('on');
    t.setAttribute('aria-checked', t.classList.contains('on')?'true':'false');
    return;
  }
  if(t.id==='menu-save'){ saveMenu(); return; }
  if(t.id==='promo-add'){
    admAction(api('/api/admin/promos',{method:'POST',admin:true,body:{
      code:(document.getElementById('promo-code').value||'').trim().toUpperCase(),
      type:document.getElementById('promo-type').value,
      value:parseInt(document.getElementById('promo-value').value,10)
    }}),'Code added');
    return;
  }
  if(t.dataset.togglepromo){
    admAction(api('/api/admin/promos/'+encodeURIComponent(t.dataset.togglepromo),{method:'PATCH',admin:true,body:{active:t.dataset.active==='1'}}),'Code updated');
    return;
  }
  if(t.dataset.delpromo){
    admAction(api('/api/admin/promos/'+encodeURIComponent(t.dataset.delpromo),{method:'DELETE',admin:true}),'Code deleted');
    return;
  }
  if(t.id==='pin-save'){
    admAction(api('/api/admin/settings',{method:'PUT',admin:true,body:{pin:(document.getElementById('set-pin').value||'').trim()}}),'PIN changed');
    return;
  }
  if(t.id==='wa-save'){
    admAction(api('/api/admin/settings',{method:'PUT',admin:true,body:{whatsapp:(document.getElementById('set-wa').value||'').trim()}}),'WhatsApp number saved');
    return;
  }
  if(t.id==='wipe'){
    if(!t.dataset.armed){ t.dataset.armed='1'; t.textContent='Click again to wipe everything'; return; }
    admTab='dash';
    admAction(api('/api/admin/wipe',{method:'POST',admin:true}),'Demo data wiped');
    return;
  }
});

document.addEventListener('input', function(ev){
  var el=ev.target;
  if(el.id==='ord-q'){ ordQ=el.value; renderAdmTab(); var q=document.getElementById('ord-q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  if(el.id==='cust-q'){ custQ=el.value; renderAdmTab(); var q2=document.getElementById('cust-q'); if(q2){ q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); } }
});
document.addEventListener('change', function(ev){
  if(ev.target.id==='ord-f'){ ordF=ev.target.value; renderAdmTab(); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
  if(e.key==='Enter'&&e.target){
    if(e.target.id==='pin'){ adminLogin(); }
    if(e.target.id==='track-q') runTrack();
    if(e.target.id==='f-promo') applyPromo();
  }
});
document.addEventListener('click', function(ev){
  if(ev.target&&ev.target.id==='scrim'){ closeModal(); closeDrawer(); }
});
addEventListener('hashchange', route);

var todayD=new Date(); var minDate=todayD.toISOString().slice(0,10);
document.addEventListener('focusin', function(e){ if(e.target&&e.target.id==='f-date') e.target.min=minDate; });

/* ---------- boot ---------- */
route();
api('/api/boot').then(function(b){
  applyBoot(b);
  if(lastView==='shop') renderShop();
  else if(lastView==='checkout') renderCheckout();
}).catch(function(){ /* render continues with defaults; API may be briefly down */ });
})();

</script>
